[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svc-panel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.135,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "paramiko>=3.5,<5", "cryptography>=43", "python-multipart>=0.0.20", "PyYAML>=6", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
