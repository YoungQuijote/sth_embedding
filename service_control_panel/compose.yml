services:
  panel:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - panel-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
volumes:
  panel-data:
